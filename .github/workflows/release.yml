name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches SKILL.md version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"

          # Reads metadata.version from the frontmatter only. The Agent Skills
          # schema rejects unknown top-level keys, so the version has to live
          # under metadata rather than at the root.
          skill_version="$(awk '
            NR == 1 && $0 == "---" { in_fm = 1; next }
            in_fm && $0 == "---" { exit }
            in_fm && /^metadata:/ { in_meta = 1; next }
            in_fm && in_meta && /^[^[:space:]]/ { in_meta = 0 }
            in_fm && in_meta && /^[[:space:]]+version:/ {
              sub(/^[[:space:]]*version:[[:space:]]*/, "")
              gsub(/["\047[:space:]]/, "")
              print
              exit
            }
          ' SKILL.md)"

          if [ -z "$skill_version" ]; then
            echo "::error::No 'metadata.version' found in SKILL.md frontmatter"
            exit 1
          fi

          if [ "$skill_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag_version, but SKILL.md declares $skill_version"
            exit 1
          fi

          echo "version=$skill_version" >> "$GITHUB_OUTPUT"

      - name: Build skill archive
        run: |
          mkdir -p dist/sony-camera-assistant
          cp SKILL.md dist/sony-camera-assistant/
          cp -R references dist/sony-camera-assistant/
          cd dist
          zip -r sony-camera-assistant.zip sony-camera-assistant
          cp sony-camera-assistant.zip sony-camera-assistant.skill
          unzip -l sony-camera-assistant.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/sony-camera-assistant.skill \
            dist/sony-camera-assistant.zip \
            --title "v$VERSION" \
            --generate-notes
